<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCRM</title>
    <!-- Modern Styling CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <title>Customer List</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1{
            color:#333;
        }

        input[type="text"]{
            padding:8px;
            width:250px;
        }

        button{
            padding:8px 15px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse: collapse;
            margin-top:20px;
        }

        th, td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background:#007bff;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        .btn{
            text-decoration:none;
            padding:5px 10px;
            border-radius:5px;
            color:white;
        }

        .view{
            background:green;
        }

        .edit{
            background:orange;
        }

        .delete{
            background:red;
        }

        .add-btn{
            display:inline-block;
            margin-top:15px;
            padding:10px 15px;
            background:#007bff;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h1>Customer List</h1>

<form method="GET" action="/customers">
    <input type="text" name="search" placeholder="Search Name, Email, Phone">
    <button type="submit">Search</button>
</form>

<a href="/add" class="add-btn">+ Add New Customer</a>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Company</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    {% for customer in customers %}
    <tr>
        <td>{{ customer.id }}</td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.company_name }}</td>
        <td>{{ customer.phone }}</td>
        <td>{{ customer.email }}</td>
        <td>
            <a href="/view/{{ customer.id }}" class="btn view">View</a>
            <a href="/edit/{{ customer.id }}" class="btn edit">Edit</a>
            <a href="/delete/{{ customer.id }}" class="btn delete"
               onclick="return confirm('Delete this customer?')">
               Delete
            </a>
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
