<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCRM</title>
    <!-- Modern Styling CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="header">
    <h1>Smart Customer CRM</h1>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2>{{ total }}</h2>
            <p>Total Customers</p>
        </div>

        <div class="card">
            <h2>Add</h2>
            <p>New Customer</p>
            <a href="/add" class="btn">Add Customer</a>
        </div>

        <div class="card">
            <h2>View</h2>
            <p>Customer List</p>
            <a href="/customers" class="btn">View Customers</a>
        </div>

    </div>

</div>

</body>
</html>
